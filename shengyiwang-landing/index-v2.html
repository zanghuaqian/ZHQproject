    function PersonaSwitch({ persona, setPersona, size = 'md' }) {

            >
              {t.label}
            </button>
          ))}
        </div>
      );
    }

    function QrMark({ seed = 7, size = 132, center = 'wx' }) {
      const cells = useMemo(() => {
        const n = 21;
        const on = (x, y) => {
          const inFinder = (ox, oy) => x >= ox && x < ox + 7 && y >= oy && y < oy + 7;
          const finderCell = (ox, oy) => {
            const lx = x - ox, ly = y - oy;
            return lx === 0 || ly === 0 || lx === 6 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4);
          };
          if (inFinder(0, 0)) return finderCell(0, 0);
          if (inFinder(14, 0)) return finderCell(14, 0);
          if (inFinder(0, 14)) return finderCell(0, 14);
          if (x >= 8 && x <= 12 && y >= 8 && y <= 12) return false;
          return ((x * 17 + y * 29 + seed * 11) % 5) > 1;
        };
        const list = [];
        for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (on(x, y)) list.push(`${x}-${y}`);
        return list;
      }, [seed]);
      return (
        <div className="relative border border-syw-line bg-white p-1.5" style={{ width: size, height: size }}>
          <svg viewBox="0 0 21 21" className="h-full w-full" aria-hidden="true">
            {cells.map((k) => {
              const [x, y] = k.split('-').map(Number);
              return <rect key={k} x={x} y={y} width="0.92" height="0.92" rx="0.08" fill="#1C2430" />;
            })}
          </svg>
          <span className="absolute left-1/2 top-1/2 grid h-8 w-8 -translate-x-1/2 -translate-y-1/2 place-items-center bg-white">
            {center === 'wx' ? (
              <svg viewBox="0 0 24 24" className="h-5 w-5 text-[#07C160]" fill="currentColor" aria-hidden="true">
                <path d="M9.5 8.6c.3-2.3 2.8-4.1 5.8-4.1 3.4 0 6.1 2.2 6.1 4.9 0 2.6-2.7 4.8-6.1 4.8-.5 0-1 0-1.4-.1l-2.4 1.2.5-1.8C10.7 12.6 9.5 10.8 9.5 8.6zm2.3.3c.4 0 .7.3.7.7s-.3.8-.7.8-.8-.3-.8-.8.4-.7.8-.7zm4.4 0c.4 0 .7.3.7.7s-.3.8-.7.8-.8-.3-.8-.8.4-.7.8-.7zM8.6 11.5c-3.1 0-5.6 2-5.6 4.5 0 1.5.9 2.8 2.3 3.7l-.4 1.5 1.8-.9c.4.1.8.1 1.2.1 3.1 0 5.6-2 5.6-4.5 0-.3 0-.5-.1-.8-1.4-1.1-3.3-1.6-4.8-1.6zM7.2 14c.3 0 .6.3.6.6s-.3.6-.6.6-.6-.3-.6-.6.3-.6.6-.6zm3.6 0c.3 0 .6.3.6.6s-.3.6-.6.6-.6-.3-.6-.6.3-.6.6-.6z" />
              </svg>
            ) : (
              <svg viewBox="0 0 24 24" className="h-5 w-5 text-[#0094FF]" fill="none" stroke="currentColor" strokeWidth="1.8">
                <path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 1 1 18 0z" />
              </svg>
            )}
          </span>
        </div>
      );
    }

    function Toast({ msg, onDone }) {

        return () => clearTimeout(t);

          </div>
          <div className="mt-3 h-1.5 overflow-hidden bg-[#EFECE6]">
            <div className="h-full w-[63%] bg-[#0094FF]" />
          </div>
        </div>
      );
    }

    function MiniApi() {
      return (
        <div className="h-[132px] overflow-hidden bg-syw-navy p-3 font-mono text-[11px] leading-relaxed text-white">
          <div className="text-white/40">POST /v1/payments</div>
          <div className="text-[#7DD3FC]">{'{'}</div>
          <div className="pl-3 text-white/80">amount: <span className="text-[#FDE68A]">12800</span>,</div>
          <div className="pl-3 text-white/80">channel: <span className="text-[#86EFAC]">"wxpay"</span></div>
          <div className="text-[#7DD3FC]">{'}'}</div>
          <div className="mt-1 inline-flex bg-[#0094FF]/25 px-1.5 py-0.5 text-[10px] text-[#7DD3FC]">200 OK · 42ms</div>
        </div>
      );
    }

    const VISUAL = { hw: HardwareGallery, saas: MiniSaaS, agent: MiniAgent, api: MiniApi };

    function AuthCard({ toast, persona }) {
      const isPartner = persona === 'partner';
      const [loginMode, setLoginMode] = useState('password');
      const [login, setLogin] = useState({ account: '', password: '', phone: '', code: '', pwdControl: false });
      const [err, setErr] = useState('');
      const [sec, setSec] = useState(0);
      const [busy, setBusy] = useState(false);

      useEffect(() => {
        setLoginMode('password');
        setErr('');
        setSec(0);
        setBusy(false);
      }, [persona]);

      useEffect(() => {
        if (sec <= 0) return undefined;
        const t = setTimeout(() => setSec((n) => n - 1), 1000);
        return () => clearTimeout(t);
      }, [sec]);

      const phoneOk = (v) => /^1[3-9]\d{9}$/.test(v);

      const sendCode = () => {
        if (!phoneOk(login.phone)) {
          setErr('请输入有效的 11 位手机号');
          return;
        }
        setErr('');
        setSec(60);
        toast('验证码已发送（演示环境，任意 6 位即可）');
      };

      const submitLogin = (e) => {
        e.preventDefault();
        if (loginMode === 'password') {
          if (!login.account.trim() || login.password.length < 6) {
            setErr('请输入账号，且密码不少于 6 位');
            return;
          }
        } else {
          if (!phoneOk(login.phone)) {
            setErr('请输入有效的 11 位手机号');
            return;
          }
          if (!/^\d{6}$/.test(login.code)) {
            setErr('请输入 6 位短信验证码');
            return;
          }
        }
        setErr('');
        setBusy(true);
        setTimeout(() => {
          setBusy(false);
          toast(isPartner ? '演示环境：即将对接服务商统一认证' : '演示环境：即将对接商户统一认证');
        }, 420);
      };

      const portalName = isPartner ? '服务商' : '商户';
      const field = 'h-11 w-full rounded-xl border border-white/70 bg-white/75 px-3.5 text-sm text-syw-ink placeholder:text-syw-mute/70 transition-colors duration-200 focus:border-[#0094FF]';

      return (
        <div className="relative">
          <div className="orb -right-8 -top-8 h-36 w-36 bg-[#0094FF]/25" />
          <div className="glass-card relative overflow-hidden rounded-[22px] p-6 shadow-glass sm:p-7">
          <p className="text-[16px] font-semibold text-syw-ink">{portalName}登录</p>
          <p className="mt-1 mb-5 text-[12px] text-syw-mute">
            {isPartner ? '渠道账号统一管理' : '收款与对账同一账号'}
          </p>
          <form onSubmit={submitLogin} className="space-y-3.5" noValidate>
            <div className="flex gap-6 border-b border-syw-line">
              {[
                { id: 'password', label: '账号密码登录' },
                { id: 'sms', label: '手机验证码登录' }
              ].map((m) => (
                <button
                  key={m.id}
                  type="button"
                  onClick={() => { setLoginMode(m.id); setErr(''); }}
                  className={`-mb-px pb-2 text-[13px] font-medium transition-colors duration-200 ${loginMode === m.id ? 'border-b-2 border-[#0094FF] text-syw-ink' : 'text-syw-mute hover:text-syw-ink'}`}
                >
                  {m.label}
                </button>
              ))}
            </div>
            {loginMode === 'password' ? (
              <>
                <label htmlFor="v2-account" className="block">
                  <span className="mb-1.5 block text-[12px] text-syw-mute">账号</span>
                  <input id="v2-account" value={login.account} onChange={(e) => setLogin({ ...login, account: e.target.value })} className={field} placeholder={isPartner ? '请输入服务商账号' : '请输入商户账号'} autoComplete="username" />
                </label>
                <label htmlFor="v2-password" className="block">
                  <span className="mb-1.5 block text-[12px] text-syw-mute">密码</span>
                  <input id="v2-password" type="password" value={login.password} onChange={(e) => setLogin({ ...login, password: e.target.value })} className={field} placeholder="请输入密码" autoComplete="current-password" />
                </label>
                <div className="flex items-center justify-between text-[12px]">
                  <label htmlFor="v2-pwd-control" className="flex min-h-11 cursor-pointer items-center gap-2 text-syw-mute">
                    <input id="v2-pwd-control" type="checkbox" checked={login.pwdControl} onChange={(e) => setLogin({ ...login, pwdControl: e.target.checked })} className="h-4 w-4 accent-[#0094FF]" />
                    使用密码控件登录
                  </label>
                  <a href="#help" className="text-[#0094FF] hover:underline">忘记密码</a>
                </div>
              </>
            ) : (
              <>
                <label htmlFor="v2-phone" className="block">
                  <span className="mb-1.5 block text-[12px] text-syw-mute">手机号</span>
                  <input id="v2-phone" value={login.phone} onChange={(e) => setLogin({ ...login, phone: e.target.value })} className={field} placeholder="请输入手机号" inputMode="numeric" maxLength={11} autoComplete="tel" />
                </label>
                <label htmlFor="v2-code" className="block">
                  <span className="mb-1.5 block text-[12px] text-syw-mute">短信验证码</span>
                  <div className="flex gap-2">
                    <input id="v2-code" value={login.code} onChange={(e) => setLogin({ ...login, code: e.target.value })} className={`${field} min-w-0 flex-1`} placeholder="6 位验证码" inputMode="numeric" maxLength={6} autoComplete="one-time-code" />
                    <button type="button" onClick={sendCode} disabled={sec > 0} className="h-11 shrink-0 rounded-xl bg-[#EAF4FC] px-3.5 text-[13px] font-medium text-[#0094FF] transition-colors duration-200 hover:bg-[#d6ecff] disabled:cursor-not-allowed disabled:text-syw-mute">
                      {sec > 0 ? `${sec}s 后重发` : '获取验证码'}
                    </button>
                  </div>
                </label>
              </>
            )}
            {err && <p className="text-[12px] text-[#C81E4A]" role="alert">{err}</p>}
            <button type="submit" disabled={busy} className="h-11 w-full rounded-xl bg-[#0094FF] text-sm font-medium text-white transition-colors duration-200 hover:bg-syw-deep disabled:cursor-wait disabled:opacity-70">
              {busy ? '正在登录…' : `登录${portalName}平台`}
            </button>
            <p className="flex items-center justify-center gap-1.5 pt-1 text-[11px] text-syw-mute">
              <Ico name="lock" className="h-3.5 w-3.5" />
              资金由合作银行存管 · TLS 加密传输
            </p>
          </form>
          </div>
        </div>
      );
    }

    function Hero({ persona, toast, onLead }) {
      const copy = PERSONA[persona];
      return (
        <section className="relative overflow-hidden border-b border-white/60">
          <div className="pointer-events-none absolute inset-0 ledger-grid" />
          <div className="orb -left-16 top-8 h-72 w-72 bg-[#0094FF]/20" />
          <div className="orb right-[28%] bottom-0 h-56 w-56 bg-[#7DD3FC]/30" />
          <div className="relative mx-auto grid max-w-[1200px] grid-cols-1 items-start gap-8 px-4 py-10 md:px-6 lg:grid-cols-10 lg:gap-10 lg:px-8 lg:py-12">
            <div className="lg:col-span-6">
              <p className="font-mono text-[11px] uppercase tracking-[0.28em] text-[#0094FF]">{copy.kicker}</p>
              <p className="mt-2 text-[13px] text-syw-mute">{copy.role}</p>
              <h1 key={persona} className="mt-1 font-serif text-[32px] font-semibold leading-[1.25] tracking-tight text-syw-ink sm:text-[40px]">
                {copy.title}
              </h1>
              <p className="mt-3 text-[15px] text-syw-mute">{copy.line}</p>
              <div className="mt-4 flex flex-wrap gap-2">
                {copy.chips.map((c) => (
                  <span key={c} className="rounded-full bg-white/70 px-3 py-1.5 text-[12px] text-syw-ink ring-1 ring-white/80 backdrop-blur">{c}</span>
                ))}
              </div>
              <HeroKV persona={persona} onLead={onLead} />
            </div>
            <div className="lg:col-span-4 lg:pt-1">
              <AuthCard key={persona} toast={toast} persona={persona} />
            </div>
          </div>
        </section>
      );
    }

    function Products({ persona, onLead }) {
      return (
        <section id="products" className="bg-syw-paper py-14">
          <div className="mx-auto max-w-[1200px] px-4 md:px-6 lg:px-8">
            <div className="mb-8 flex items-end justify-between gap-6">
              <div>
                <h2 className="font-serif text-[26px] font-semibold text-syw-ink">核心产品</h2>
                <p className="mt-2 max-w-xl text-sm leading-6 text-syw-mute">商户看收银与经营，服务商看展业与开放网关。</p>
              </div>
              <a href="#open-platform" className="hidden h-11 items-center text-sm text-[#0094FF] md:inline-flex">开放平台文档</a>
            </div>
            <div className="grid grid-cols-1 gap-5 md:grid-cols-12">
              {PRODUCTS.map((p) => {
                const Visual = VISUAL[p.id];
                const active = p.persona === persona;
                return (
                  <article
                    key={p.id}
                    id={p.id === 'api' ? 'open-platform' : undefined}
                    className={`relative bg-syw-card p-5 ${p.span} ${active ? 'border-2 border-[#0094FF]' : 'border border-syw-line'}`}
                  >
                    {active && <span className="absolute right-4 top-4 text-[11px] text-[#0094FF]">当前路径</span>}
                    <div className="mb-4"><Visual /></div>
                    <p className="text-[12px] text-syw-mute">{p.kicker}</p>
                    <h3 className="mt-1 text-[18px] font-semibold text-syw-ink">{p.title}</h3>
                    <p className="mt-2 text-[13px] leading-6 text-syw-mute">{p.pain}</p>
                    <div className="mt-4 grid grid-cols-2 gap-2">
                      {p.stats.map((s) => (
                        <div key={s.l} className="bg-[#F7F5F0] px-3 py-2.5">
                          <div className="num text-[18px] font-semibold text-syw-ink">{s.n}</div>
                          <div className="text-[11px] text-syw-mute">{s.l}</div>
                        </div>
                      ))}
                    </div>
                    <button onClick={onLead} className="mt-5 inline-flex h-11 items-center bg-[#0094FF] px-4 text-[13px] font-medium text-white transition-colors duration-200 hover:bg-syw-deep">
                      获取方案
                    </button>
                  </article>
                );
              })}
            </div>
          </div>
        </section>
      );
    }

    function Trust() {
      const items = [
        { n: '百亿级', l: '日均交易量', d: '覆盖零售、餐饮、政企采购等场景' },
        { n: '银行级', l: '资金合规', d: '备付金存管 · 支付业务许可经营' },
        { n: '7×24', l: '小时技术保障', d: '交易、结算、对账链路全天候值守' }
      ];
      return (
        <section className="bg-syw-navy py-14 text-white">
          <div className="mx-auto max-w-[1200px] px-4 md:px-6 lg:px-8">
            <div className="mb-8 flex items-center gap-3">
              <Ico name="shield" className="h-5 w-5 text-[#7DD3FC]" />
              <h2 className="font-serif text-[22px] font-semibold">金融级安全，可被审计的确定性</h2>
            </div>
            <div className="mb-8 flex flex-wrap gap-x-6 gap-y-2 text-[13px] text-white/70">
              {['支付业务许可', '备付金银行存管', '等保三级', 'TLS 全链路加密'].map((b) => (
                <span key={b}>{b}</span>
              ))}
            </div>
            <div className="grid grid-cols-1 divide-y divide-white/15 md:grid-cols-3 md:divide-x md:divide-y-0">
              {items.map((it) => (
                <div key={it.l} className="py-6 md:px-10 md:py-1 first:pl-0 last:pr-0">
                  <div className="num text-[36px] font-semibold leading-none">{it.n}</div>
                  <div className="mt-3 text-[15px] text-white/80">{it.l}</div>
                  <p className="mt-2 text-[13px] text-white/50">{it.d}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function LeadBand({ toast, persona }) {
      const [form, setForm] = useState({
        company: '',
        phone: '',
        demand: persona === 'partner' ? 'agent' : 'pay'
      });
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);
      useEffect(() => {
        setForm((s) => ({ ...s, demand: persona === 'partner' ? 'agent' : 'pay' }));
      }, [persona]);

      const onSubmit = (e) => {
        e.preventDefault();
        if (!form.company.trim()) { setErr('请填写企业名称'); return; }
        if (!/^1[3-9]\d{9}$/.test(form.phone)) { setErr('请输入有效的 11 位手机号'); return; }
        setErr('');
        setBusy(true);
        setTimeout(() => {
          setBusy(false);
          toast('已收到需求，顾问将在 30 分钟内提供专属报价');
          setForm({ company: '', phone: '', demand: form.demand });
        }, 420);
      };

      const field = 'h-12 border border-syw-line bg-white px-4 text-sm text-syw-ink placeholder:text-syw-mute/80 transition-colors duration-200 focus:border-[#0094FF]';

      return (
        <section id="lead" className="bg-syw-card py-14">
          <div className="mx-auto grid max-w-[1200px] grid-cols-1 items-center gap-10 px-4 md:px-6 lg:grid-cols-10 lg:px-8">
            <div className="lg:col-span-7">
              <h2 className="font-serif text-[26px] font-semibold text-syw-ink">30 分钟内提供专属报价</h2>
              <p className="mt-3 max-w-xl text-sm leading-6 text-syw-mute">留下企业信息，按商户 / 服务商匹配产品、费率与硬件方案。</p>
              <form onSubmit={onSubmit} className="mt-8 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4" noValidate>
                <label className="sr-only" htmlFor="v2-company">企业名称</label>
                <input id="v2-company" value={form.company} onChange={(e) => setForm({ ...form, company: e.target.value })} placeholder="企业名称" className={field} />
                <label className="sr-only" htmlFor="v2-lead-phone">手机号</label>
                <input id="v2-lead-phone" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} placeholder="手机号" inputMode="numeric" maxLength={11} className={field} />
                <label className="sr-only" htmlFor="v2-demand">需求类型</label>
                <select id="v2-demand" value={form.demand} onChange={(e) => setForm({ ...form, demand: e.target.value })} className={field}>
                  {DEMANDS.map((d) => <option key={d.value} value={d.value}>{d.label}</option>)}
                </select>
                <button type="submit" disabled={busy} className="h-12 bg-[#0094FF] text-sm font-medium text-white transition-colors duration-200 hover:bg-syw-deep disabled:cursor-wait disabled:opacity-70">
                  {busy ? '提交中…' : '提交需求'}
                </button>
              </form>
              {err && <p className="mt-3 text-[12px] text-[#C81E4A]" role="alert">{err}</p>}
            </div>
            <div className="lg:col-span-3">
              <div className="mx-auto flex max-w-[240px] flex-col items-center border border-syw-line bg-syw-paper p-5 lg:ml-auto">
                <QrMark seed={11} size={156} center="chat" />
                <p className="mt-3 text-[13px] font-medium text-syw-ink">专属渠道顾问</p>
                <p className="mt-1 text-center text-[11px] text-syw-mute">微信扫码沟通费率与进件</p>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer id="help" className="border-t border-syw-line bg-syw-paper py-10">
          <div className="mx-auto flex max-w-[1200px] flex-col gap-8 px-4 md:flex-row md:items-end md:justify-between md:px-6 lg:px-8">
            <div>
              <Logo compact />
              <p className="mt-4 max-w-md text-[12px] leading-6 text-syw-mute">
                © 2026 盛意旺科技有限公司 保留所有权利<br />
                支付业务许可证编号：Z2017XXXXXXXX · ICP备XXXXXXXX号-1
              </p>
              <div className="mt-3 flex gap-4 text-[12px] text-syw-mute">
                <a href="#help" className="hover:text-syw-ink">隐私政策</a>
                <a href="#help" className="hover:text-syw-ink">服务协议</a>
                <a href="#open-platform" className="hover:text-syw-ink">开放平台</a>
              </div>
            </div>
            <div className="flex gap-6">
              {[
                { title: '盛意旺公众号', seed: 3, center: 'wx' },
                { title: '在线客服', seed: 19, center: 'chat' }
              ].map((q) => (
                <div key={q.title} className="flex flex-col items-center">
                  <QrMark seed={q.seed} size={88} center={q.center} />
                  <span className="mt-2 text-[11px] text-syw-mute">{q.title}</span>
                </div>
              ))}
            </div>
          </div>
        </footer>
      );
    }

    function FloatBar() {
      const [showTop, setShowTop] = useState(false);
      const [open, setOpen] = useState(null);
      useEffect(() => {
        const onScroll = () => setShowTop(window.scrollY > 420);
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      const items = [
        { id: 'cs', label: '在线客服', icon: 'chat', qr: 19, center: 'chat', copy: '扫码添加在线客服' },
        { id: 'wx', label: '官方微信', icon: 'wechat', qr: 3, center: 'wx', copy: '扫码关注官方公众号' }
      ];
      return (
        <div className="fixed bottom-6 right-5 z-50 flex flex-col items-end gap-2">
          {items.map((it) => (
            <div key={it.id} className="relative">
              <div className={`absolute right-[54px] top-1/2 w-[176px] -translate-y-1/2 border border-syw-line bg-syw-card p-3 transition-opacity duration-200 ${open === it.id ? 'opacity-100' : 'pointer-events-none opacity-0'}`}>
                <QrMark seed={it.qr} size={152} center={it.center} />
                <p className="mt-2 text-center text-[11px] text-syw-mute">{it.copy}</p>
              </div>
              <button
                aria-label={it.label}
                aria-expanded={open === it.id}
                onClick={() => setOpen((v) => (v === it.id ? null : it.id))}
                className="grid h-12 w-12 place-items-center border border-syw-line bg-syw-card text-syw-ink transition-colors duration-200 hover:text-[#0094FF]"
              >
                <Ico name={it.icon} />
              </button>
            </div>
          ))}
          <button
            aria-label="返回顶部"
            onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
            className={`grid h-12 w-12 place-items-center bg-syw-ink text-white transition-opacity duration-200 ${showTop ? 'opacity-100' : 'pointer-events-none opacity-0'}`}
          >
            <Ico name="top" />
          </button>
        </div>
      );
    }

    function App() {
      const [persona, setPersona] = useState('merchant');
      const [menuOpen, setMenuOpen] = useState(false);
      const [toast, setToast] = useState('');
      const goLead = () => {
        setMenuOpen(false);
        document.getElementById('lead')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      return (
        <div id="top" className="min-h-screen bg-syw-paper">
          <a href="#products" className="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[90] focus:bg-white focus:px-3 focus:py-2">跳到产品矩阵</a>
          <Header onLead={goLead} menuOpen={menuOpen} onOpenMenu={() => setMenuOpen((v) => !v)} persona={persona} setPersona={setPersona} />
          <main>
            <Hero persona={persona} toast={setToast} onLead={goLead} />
            <Products persona={persona} onLead={goLead} />
            <Trust />
            <LeadBand toast={setToast} persona={persona} />
          </main>
          <Footer />
          <FloatBar />
          {toast && <Toast msg={toast} onDone={() => setToast('')} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
