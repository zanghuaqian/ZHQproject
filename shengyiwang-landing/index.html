<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>盛意旺 · 让每一笔生意更兴旺</title>
  <meta name="description" content="盛意旺综合商户平台：极速收款、数字化经营、服务商分润与开放 API。面向收单商户与收单服务商的金融科技门户。" />
  <script src="vendor/tailwindcss.js"></script>
  <script>
    tailwind.config = {
      theme: {
        screens: {
          sm: '0px',
          md: '0px',
          lg: '0px',
          xl: '0px',
          '2xl': '0px'
        },
        extend: {
          colors: {
            syw: {
              DEFAULT: '#0094FF',
              deep: '#0076CC',
              soft: '#E8F4FF',
              mist: '#F5F7FA',
              navy: '#071422',
              ink: '#0C1B2E',
              mute: '#5B6B7C',
              line: '#E3E8EF',
              gold: '#C4A35A'
            }
          },
          fontFamily: {
            sans: ['Noto Sans SC', 'IBM Plex Sans', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            display: ['IBM Plex Sans', 'Noto Sans SC', 'sans-serif'],
            mono: ['IBM Plex Mono', 'ui-monospace', 'monospace']
          },
          boxShadow: {
            glass: '0 18px 50px rgba(12, 27, 46, 0.10), 0 0 0 1px rgba(255,255,255,0.65)',
            lift: '0 22px 40px rgba(12, 27, 46, 0.12)'
          },
          transitionTimingFunction: {
            syw: 'cubic-bezier(0.4, 0, 0.2, 1)'
          }
        }
      }
    };
  </script>
  <style>
    :root { --syw: #0094FF; --page-min-width: 1280px; }
    html {
      min-width: var(--page-min-width);
    }
    html, body { background: #F5F7FA; }
    body {
      min-width: var(--page-min-width);
      font-family: 'Noto Sans SC', 'IBM Plex Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #0C1B2E;
      -webkit-font-smoothing: antialiased;
    }
    /* 产品矩阵 / 行业方案 · 标签与合作名称 */
    .syw-label-tag,
    .product-footer-kicker {
      font-family: 'PingFang SC', 'Microsoft YaHei Light', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      font-size: 12px;
      font-weight: 300;
      font-synthesis: none;
      letter-spacing: 0.02em;
      text-transform: none;
      line-height: 1.4;
    }
    .ledger-grid {
      background-image:
        linear-gradient(rgba(0,148,255,0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,148,255,0.055) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .grain::before {
      content: '';
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: 0.28;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.55'/></svg>");
    }
    .glass-card {
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(22px) saturate(1.35);
      -webkit-backdrop-filter: blur(22px) saturate(1.35);
    }
    /* Hero + 支付渠道：共用扩图后的主 KV，单层连续延伸（无中间渐变缝） */
    .hero-pay-band {
      position: relative;
      overflow: hidden;
      margin-top: -4rem; /* 对齐 header h-16 */
      padding-top: 4rem;
      background-color: #F5F7FA;
    }
    .hero-pay-band-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }
    .hero-pay-band.is-partner .hero-pay-band-bg {
      /* 服务商 KV 主体偏左上，拉近构图避免被蒙层洗成空白 */
      background-position: 58% 12%;
      background-size: cover;
    }
    .hero-pay-band-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      /* 左侧轻雾保可读；支付区尽量透出 KV；底部极短距离柔和衔接到产品矩阵 */
      background:
        linear-gradient(102deg,
          rgba(245,247,250,0.82) 0%,
          rgba(245,247,250,0.42) 18%,
          rgba(245,247,250,0.10) 34%,
          transparent 54%),
        linear-gradient(180deg,
          transparent 0%,
          transparent 72%,
          rgba(245,247,250,0.08) 84%,
          rgba(255,255,255,0.55) 94%,
          #ffffff 100%);
    }
    .hero-pay-band.is-partner .hero-pay-band-overlay {
      background:
        linear-gradient(102deg,
          rgba(245,247,250,0.52) 0%,
          rgba(245,247,250,0.22) 16%,
          rgba(245,247,250,0.06) 30%,
          transparent 48%),
        linear-gradient(180deg,
          transparent 0%,
          transparent 76%,
          rgba(245,247,250,0.10) 88%,
          rgba(255,255,255,0.55) 96%,
          #ffffff 100%);
    }
    /* 底部过渡压在内容之下，避免盖住支付区/衔接文字 */
    .hero-pay-band-bg,
    .hero-pay-band-overlay {
      z-index: 0;
    }
    .hero-pay-band > :not(.hero-pay-band-bg):not(.hero-pay-band-overlay) {
      position: relative;
      z-index: 1;
    }
    .hero-shell {
      position: relative;
      z-index: 1;
      overflow: visible;
      min-height: clamp(500px, 66vh, 640px);
      background: transparent;
    }
    /* 首屏左右垂直居中；登录卡固定高度，切换时不带动左侧抖动 */
    .hero-shell-grid {
      position: relative;
      z-index: 2;
      align-items: center;
    }
    /* 首屏文案：与支付渠道相同的半透明白羽化毛玻璃底 */
    .hero-copy {
      position: relative;
      z-index: 1;
    }
    .hero-copy-panel {
      pointer-events: none;
      position: absolute;
      z-index: 0;
      inset: -36px -56px -40px -40px;
      border: none;
      border-radius: 48px;
      background: radial-gradient(ellipse 68% 64% at 42% 48%,
        rgba(255,255,255,0.48) 0%,
        rgba(255,255,255,0.26) 40%,
        rgba(255,255,255,0.08) 68%,
        rgba(255,255,255,0) 100%);
      box-shadow: 0 28px 80px rgba(12, 27, 46, 0.04);
      backdrop-filter: blur(22px) saturate(1.18);
      -webkit-backdrop-filter: blur(22px) saturate(1.18);
      -webkit-mask-image: radial-gradient(ellipse 78% 74% at 42% 50%,
        #000 22%,
        rgba(0,0,0,0.82) 48%,
        rgba(0,0,0,0.35) 72%,
        transparent 100%);
      mask-image: radial-gradient(ellipse 78% 74% at 42% 50%,
        #000 22%,
        rgba(0,0,0,0.82) 48%,
        rgba(0,0,0,0.35) 72%,
        transparent 100%);
    }
    .hero-copy > :not(.hero-copy-panel) {
      position: relative;
      z-index: 1;
    }
    .auth-card-stable {
      min-height: 469px;
      contain: layout;
    }
    .wx-fold {
      clip-path: polygon(0 0, 100% 0, 100% 100%);
    }
    .num { font-family: 'IBM Plex Sans', 'Noto Sans SC', sans-serif; font-variant-numeric: tabular-nums; }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float-y {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .rise { animation: rise-in 0.55s ease-in-out both; }
    .float-slow { animation: float-y 5.5s ease-in-out infinite; }
    .float-slower { animation: float-y 7s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    input, select { outline: none; }
    button, a { outline: none; cursor: pointer; }
    input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
      box-shadow: 0 0 0 3px rgba(0,148,255,0.28);
    }
    .case-copy-shadow {
      text-shadow:
        0 0 14px rgba(255,255,255,.95),
        0 0 28px rgba(255,255,255,.85),
        0 2px 8px rgba(12,27,46,.12);
    }
    .case-left-scrim {
      background: linear-gradient(
        90deg,
        rgba(255,255,255,.97) 0%,
        rgba(255,255,255,.92) 18%,
        rgba(255,255,255,.78) 32%,
        rgba(255,255,255,.52) 46%,
        rgba(255,255,255,.24) 58%,
        rgba(255,255,255,.08) 68%,
        rgba(255,255,255,0) 82%
      );
    }
    .solution-tab-active {
      box-shadow: 0 12px 30px rgba(0,148,255,.10);
    }

    /* ── 支付方式 ── */
    #payment-methods {
      scroll-margin-top: 4rem;
      position: relative;
      z-index: 1;
      overflow: hidden;
      margin-top: 0;
      padding: 12px 0 28px;
      background: transparent;
      color: #0C1B2E;
    }
    #payment-methods .pay-scatter-shell {
      position: relative;
      z-index: 2;
      width: 1200px;
      height: 600px;
      min-height: 600px;
      max-width: 1200px;
      perspective: 800px;
    }
    /* 半透明毛玻璃浮层：托住图标圆环与中心文案（边缘羽化，无清晰描边） */
    #payment-methods .pay-scatter-panel {
      pointer-events: none;
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      width: min(96%, 800px);
      height: min(94%, 560px);
      transform: translate(-50%, -50%);
      border: none;
      border-radius: 48px;
      background: radial-gradient(ellipse 68% 64% at 50% 48%,
        rgba(255,255,255,0.48) 0%,
        rgba(255,255,255,0.26) 40%,
        rgba(255,255,255,0.08) 68%,
        rgba(255,255,255,0) 100%);
      box-shadow: 0 28px 80px rgba(12, 27, 46, 0.04);
      backdrop-filter: blur(22px) saturate(1.18);
      -webkit-backdrop-filter: blur(22px) saturate(1.18);
      -webkit-mask-image: radial-gradient(ellipse 78% 74% at 50% 50%,
        #000 22%,
        rgba(0,0,0,0.82) 48%,
        rgba(0,0,0,0.35) 72%,
        transparent 100%);
      mask-image: radial-gradient(ellipse 78% 74% at 50% 50%,
        #000 22%,
        rgba(0,0,0,0.82) 48%,
        rgba(0,0,0,0.35) 72%,
        transparent 100%);
    }
    #payment-methods .pay-scatter-stars {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
    }
    #payment-methods .pay-scatter-star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(0, 148, 255, 0.45);
      box-shadow: 0 0 8px rgba(0, 148, 255, 0.28);
      animation: pay-star-twinkle 3.6s ease-in-out infinite;
    }
    @keyframes pay-star-twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.75; transform: scale(1.35); }
    }
    #payment-methods .pay-scatter-world {
      position: absolute;
      inset: 0;
      z-index: 3;
      transform-style: preserve-3d;
    }
    #payment-methods .pay-scatter-node {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 88px;
      margin-left: -44px;
      margin-top: -44px;
      transform-style: preserve-3d;
      transform: translate3d(0, 0, 0) scale(0.22);
      opacity: 0;
      transition:
        transform var(--pay-duration, 2s) var(--pay-ease, cubic-bezier(0.34, 1.56, 0.64, 1)),
        opacity 0.9s ease;
      transition-delay: var(--pay-delay, 0s);
      will-change: transform, opacity;
    }
    #payment-methods .pay-scatter-node.is-spread {
      transform: translate3d(var(--tx), var(--ty), var(--tz)) scale(1);
      opacity: 1;
    }
    #payment-methods .pay-scatter-breathe {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transform-style: preserve-3d;
    }
    #payment-methods .pay-scatter-breathe.is-breathing {
      animation: pay-breathe var(--breathe-dur, 3.6s) ease-in-out infinite;
      animation-delay: var(--breathe-delay, 0s);
    }
    @keyframes pay-breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    #payment-methods .pay-scatter-face {
      transform-style: preserve-3d;
      /* 散开后保持正面，不做球状偏转 */
      transform: none;
    }
    #payment-methods .pay-scatter-badge {
      position: relative;
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 10px 28px rgba(12, 27, 46, 0.08),
        0 0 20px var(--glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px) saturate(1.3);
      -webkit-backdrop-filter: blur(12px) saturate(1.3);
    }
    #payment-methods .pay-scatter-badge::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
      z-index: -1;
      opacity: 0.28;
    }
    #payment-methods .pay-scatter-logo {
      width: 34px;
      height: 34px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(12, 27, 46, 0.12));
    }
    #payment-methods .pay-scatter-label {
      max-width: 108px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.25;
      color: #0C1B2E;
      text-align: center;
      text-shadow: none;
      white-space: nowrap;
    }
    #payment-methods .pay-scatter-copy {
      pointer-events: none;
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 4;
      width: min(92vw, 420px);
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0;
      filter: blur(6px);
      transition: opacity 0.9s ease, filter 0.9s ease, transform 0.9s ease;
      transition-delay: var(--copy-delay, 0.45s);
    }
    #payment-methods .pay-scatter-copy.is-in {
      opacity: 1;
      filter: blur(0);
      transform: translate(-50%, -50%) scale(1);
    }
    #payment-methods .pay-scatter-kicker {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #0094FF;
    }
    #payment-methods .pay-scatter-title {
      margin-top: 10px;
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #0C1B2E;
      text-shadow: 0 8px 28px rgba(255, 255, 255, 0.65);
    }
    #payment-methods .pay-scatter-sub {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: #5B6B7C;
    }
    @media (max-width: 0px) {
      #payment-methods .pay-scatter-shell {
        min-height: 500px;
      }
      #payment-methods .pay-scatter-label {
        font-size: 11px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #payment-methods .pay-scatter-node,
      #payment-methods .pay-scatter-face,
      #payment-methods .pay-scatter-copy {
        transition: none !important;
      }
      #payment-methods .pay-scatter-breathe.is-breathing,
      #payment-methods .pay-scatter-star {
        animation: none !important;
      }
      #payment-methods .pay-scatter-node {
        opacity: 1;
        transform: translate3d(var(--tx), var(--ty), var(--tz)) scale(1);
      }
      #payment-methods .pay-scatter-copy {
        opacity: 1;
        filter: none;
      }
    }

    /* ── 核心产品矩阵 · 2+3 错落布局 ── */
    .product-matrix {
      scroll-margin-top: 4rem;
      position: relative;
      z-index: 2;
      /* 与支付区白底柔和衔接，底部半透明溶入雾灰 */
      background: linear-gradient(180deg,
        #ffffff 0%,
        #ffffff 48%,
        rgba(245,247,250,0.38) 78%,
        #F5F7FA 100%);
    }
    .product-matrix > * {
      position: relative;
      z-index: 1;
    }

    /* ── 区块半透明衔接：相邻区域长渐变互溶，不要实线/硬色切 ── */
    .section-soft {
      position: relative;
      border-top: none !important;
    }
    .section-soft > * {
      position: relative;
      z-index: 1;
    }
    #solutions.section-soft {
      background: linear-gradient(180deg,
        #F5F7FA 0%,
        #F5F7FA 14%,
        rgba(255,255,255,0.42) 48%,
        #F5F7FA 100%);
    }
    #cases.section-soft {
      background: linear-gradient(180deg,
        #F5F7FA 0%,
        rgba(255,255,255,0.55) 22%,
        #ffffff 46%,
        #ffffff 72%,
        rgba(245,247,250,0.72) 100%);
    }
    #partners.section-soft {
      /* 蜂窝区浅天蓝；底部不收成实色，交给信任区从透明溶入，避免色块硬切 */
      background: linear-gradient(180deg,
        #ffffff 0%,
        #F5F7FA 22%,
        #F5F7FA 40%,
        #F2F8FF 52%,
        #E4F2FF 64%,
        #C8E6FF 76%,
        #A3D4FF 88%,
        #7EC4FF 100%);
      overflow: hidden;
    }
    #partners.section-soft::after {
      display: none;
    }
    .trust-band {
      position: relative;
      overflow: hidden;
      margin-top: -8rem;
      background: linear-gradient(180deg, transparent 0%, #0094FF 8rem, #0094FF 100%);
      border-top: none;
    }
    .trust-band::before {
      display: none;
    }
    .trust-band > .pointer-events-none.absolute {
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 8rem);
      mask-image: linear-gradient(180deg, transparent 0%, #000 8rem);
    }
    .trust-band > * {
      position: relative;
      z-index: 2;
    }
    .lead-band {
      position: relative;
      overflow: hidden;
      background: #0094FF;
      border-top: none;
    }
    .lead-band > * {
      position: relative;
      z-index: 2;
    }
    .site-footer {
      position: relative;
      border-top: none !important;
      background: linear-gradient(180deg, rgba(245,247,250,0.94) 0%, #F5F7FA 22%, #F5F7FA 100%);
      margin-top: -1px;
    }
    .product-bento {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .product-bento-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      align-items: stretch;
    }
    @media (min-width: 0px) {
      .product-bento-row-1 {
        grid-template-columns: 7fr 5fr;
      }
      .product-bento-row-2 {
        grid-template-columns: 3.2fr 3.2fr 5.6fr;
      }
      .product-bento-row-1 .product-bento-visual {
        min-height: 168px;
      }
      .product-bento-row-1 .product-bento-hw-card .product-bento-visual {
        min-height: 300px;
      }
      .product-bento-row-1 .product-bento-hw-card #my-carousel {
        height: 300px;
      }
      .product-bento-row-2 .product-bento-visual {
        min-height: 168px;
      }
    }
    @media (min-width: 0px) {
      .product-bento-row-1 .product-bento-hw-card .product-bento-visual {
        min-height: 320px;
      }
      .product-bento-row-1 .product-bento-hw-card #my-carousel {
        height: 320px;
      }
    }
    /* 行业方案大卡 · 左右衔接蒙层 */
    .solution-seam-fade {
      pointer-events: none;
      position: absolute;
      inset-block: 0;
      right: 0;
      z-index: 2;
      width: 4.5rem;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 45%, rgba(255,255,255,.92) 100%);
    }
    @media (max-width: 0px) {
      .solution-seam-fade {
        inset-block: auto;
        inset-inline: 0;
        top: auto;
        bottom: 0;
        right: auto;
        width: auto;
        height: 3.5rem;
        background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 45%, rgba(255,255,255,.92) 100%);
      }
    }
    .product-bento-hw-card {
      padding: 0 !important;
    }
    .product-bento-hw-card .product-bento-visual {
      flex: 1 1 auto;
      margin-bottom: 0;
      min-height: 280px;
    }
    .product-bento-hero-card {
      padding: 0 !important;
    }
    .product-bento-hero-card .product-bento-visual {
      flex: 1 1 auto;
      margin-bottom: 0;
      min-height: 240px;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 0px) {
      .product-bento-row-1 .product-bento-hero-card .product-bento-visual {
        min-height: 300px;
      }
      .product-bento-row-2 .product-bento-hero-card .product-bento-visual {
        min-height: 260px;
      }
    }
    @media (min-width: 0px) {
      .product-bento-row-1 .product-bento-hero-card .product-bento-visual {
        min-height: 320px;
      }

      perspective-origin: 50% 46%;

    /* ── 合作商户蜂窝聚合 ── */
    .partner-honeycomb {

      --hex-gap: 12px;
      --hex-h: calc(var(--hex-w) * 1.1547);
      /* 蜂巢行距：使斜向邻边间距 = 同行左右间距 (--hex-gap) */
      --hex-row-step: calc(var(--hex-h) * 0.75 + var(--hex-gap));

        --hex-w: 88px;

      display: flex;
      justify-content: center;
      gap: var(--hex-gap);
    }
    .partner-honeycomb-row + .partner-honeycomb-row {
      margin-top: calc(var(--hex-row-step) - var(--hex-h));
    }

      width: var(--hex-w);

      flex-shrink: 0;

    .partner-hex-mark {
      display: grid;

    function initHardwareCarousel(container) {
      if (!container || container.dataset.carouselReady === '1') {
        return function noop() {};
      }

      const count = products.length;
      const stepDeg = 360 / count;

      const ring = container.querySelector('.carousel-ring');
      const pageEl = container.querySelector('.carousel-page');
      const prevBtn = container.querySelector('.carousel-prev');
      const nextBtn = container.querySelector('.carousel-next');

      let current = 0;
      let cards = [];
      let radiusX = 200;
      let radiusZ = 160;

      function measureRadii() {
        var w = container.clientWidth || 360;
        radiusX = Math.min(Math.max(w * 0.34, 120), 240);
        radiusZ = Math.min(Math.max(w * 0.26, 90), 180);
      }

      products.forEach(function (p, i) {
        const card = document.createElement('div');
        card.className = 'carousel-card';
        card.dataset.index = String(i);
        card.innerHTML =
          '<div class="carousel-card-inner">' +
            '<img src="' + p.img + '" alt="' + p.name + '" loading="lazy" />' +
            '<div class="carousel-card-name">' + p.name + '</div>' +
            '<div class="carousel-card-overlay"><p>' + p.desc + '</p></div>' +
          '</div>';
        ring.appendChild(card);
      });

      cards = Array.from(ring.querySelectorAll('.carousel-card'));

      function relIndex(i) {
        var rel = i - current;
        var half = count / 2;
        if (rel > half) rel -= count;
        if (rel < -half) rel += count;
        return rel;
      }

      function layout() {
        measureRadii();
        cards.forEach(function (card, i) {
          var rel = relIndex(i);
          var angleDeg = rel * stepDeg;
          var rad = angleDeg * Math.PI / 180;
          var x = Math.sin(rad) * radiusX;
          var z = Math.cos(rad) * radiusZ;
          var scale = Math.max(0.5, 1 - Math.abs(rel) * 0.13);
          var opacity = Math.max(0.22, 1 - Math.abs(rel) * 0.2);
          var blur = Math.abs(rel) >= 3 ? 1.8 : Math.abs(rel) * 0.45;

          card.style.transform = 'translate3d(' + x + 'px, 0, ' + z + 'px) scale(' + scale + ')';
          card.style.opacity = String(opacity);
          card.style.zIndex = String(Math.round(100 - Math.abs(rel) * 10));
          card.style.filter = blur > 0.05 ? 'blur(' + blur + 'px)' : 'none';
          card.classList.toggle('is-active', i === current);
        });
        pageEl.textContent = (current + 1) + '/' + count;
      }

      function goTo(index, fast) {
        if (index === current) return;
        current = ((index % count) + count) % count;
        if (fast) {
          container.classList.add('is-fast-spin');
          window.setTimeout(function () {
            container.classList.remove('is-fast-spin');
          }, 400);
        }
        layout();
      }

      function onPrev() {
        goTo(current - 1, false);
      }

      function onNext() {
        goTo(current + 1, false);
      }

      function onCardClick(e) {
        var card = e.target.closest('.carousel-card');
        if (!card || !ring.contains(card)) return;
        var index = parseInt(card.dataset.index, 10);
        if (Number.isNaN(index) || index === current) return;
        goTo(index, true);
      }

      prevBtn.addEventListener('click', onPrev);
      nextBtn.addEventListener('click', onNext);
      ring.addEventListener('click', onCardClick);

      var onResize = function () { layout(); };
      window.addEventListener('resize', onResize);

      layout();
      container.dataset.carouselReady = '1';

      return function cleanup() {
        prevBtn.removeEventListener('click', onPrev);
        nextBtn.removeEventListener('click', onNext);
        ring.removeEventListener('click', onCardClick);
        window.removeEventListener('resize', onResize);
        container.classList.remove('is-fast-spin');
        ring.innerHTML = '';
        delete container.dataset.carouselReady;
      };
    }

    window.initHardwareCarousel = initHardwareCarousel;

    /* 合作案例水平手风琴 — 修改 partners 即可替换内容 */
    function partnerRgbToHex(r, g, b) {
      return '#' + [r, g, b].map(function (v) {
        var h = v.toString(16);
        return h.length === 1 ? '0' + h : h;
      }).join('');
    }

    function partnerIsNearWhite(r, g, b, a) {
      return a > 20 && r > 215 && g > 215 && b > 215;
    }

    function partnerIsSaturated(r, g, b) {
      return Math.max(r, g, b) - Math.min(r, g, b) > 35;
    }

    function partnerHexToRgb(hex) {
      var match = hex.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
      return match
        ? [parseInt(match[1], 16), parseInt(match[2], 16), parseInt(match[3], 16)]
        : [0, 148, 255];
    }

    function partnerRgba(rgb, alpha) {
      return 'rgba(' + rgb[0] + ', ' + rgb[1] + ', ' + rgb[2] + ', ' + alpha + ')';
    }

    function partnerBuildGlassBg(cardBg, opts) {
      opts = opts || {};
      if (cardBg.indexOf('gradient') !== -1) {
        var top = opts.topRgb || [222, 17, 120];
        var bot = opts.botRgb || [67, 1, 146];
        return 'linear-gradient(160deg, ' +
          partnerRgba(top, 0.62) + ' 0%, ' +
          partnerRgba(bot, 0.44) + ' 100%)';
      }
      var rgb = partnerHexToRgb(cardBg);
      return 'linear-gradient(155deg, ' +
        partnerRgba(rgb, 0.68) + ' 0%, ' +
        partnerRgba(rgb, 0.36) + ' 52%, ' +
        partnerRgba(rgb, 0.54) + ' 100%)';
    }

    function partnerTopBucketColor(bucket) {
      var bestKey = null;
      var bestCount = 0;
      Object.keys(bucket).forEach(function (key) {
        if (key.indexOf('_rgb') !== -1) return;
        if (bucket[key] > bestCount) {
          bestCount = bucket[key];
          bestKey = key;
        }
      });
      return bestKey ? bucket[bestKey + '_rgb'] : null;
    }

    function analyzePartnerLogo(logoPath, overrides, callback) {
      overrides = overrides || {};
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth;
        var h = img.naturalHeight;
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        var imageData = ctx.getImageData(0, 0, w, h);
        var px = imageData.data;

        var whiteCount = 0;
        var coloredCount = 0;
        var brandBucket = {};
        var bgBucket = {};
        var topBucket = {};
        var botBucket = {};

        for (var y = 0; y < h; y++) {
          for (var x = 0; x < w; x++) {
            var idx = (y * w + x) * 4;
            var r = px[idx];
            var g = px[idx + 1];
            var b = px[idx + 2];
            var a = px[idx + 3];
            if (a < 20) continue;

            if (partnerIsNearWhite(r, g, b, a)) {
              whiteCount++;
              continue;
            }

            coloredCount++;
            var bgKey = Math.round(r / 32) + ',' + Math.round(g / 32) + ',' + Math.round(b / 32);
            bgBucket[bgKey] = (bgBucket[bgKey] || 0) + 1;
            bgBucket[bgKey + '_rgb'] = [r, g, b];

            if (partnerIsSaturated(r, g, b)) {
              var brandKey = Math.round(r / 24) * 11 + Math.round(g / 24) * 7 + Math.round(b / 24);
              if (!brandBucket[brandKey]) {
                brandBucket[brandKey] = { count: 0, r: 0, g: 0, b: 0 };
              }
              brandBucket[brandKey].count++;
              brandBucket[brandKey].r += r;
              brandBucket[brandKey].g += g;
              brandBucket[brandKey].b += b;
            }

            if (y < h * 0.35) {
              topBucket[bgKey] = (topBucket[bgKey] || 0) + 1;
              topBucket[bgKey + '_rgb'] = [r, g, b];
            } else if (y > h * 0.65) {
              botBucket[bgKey] = (botBucket[bgKey] || 0) + 1;
              botBucket[bgKey + '_rgb'] = [r, g, b];
            }
          }
        }

        var isWhiteBg = whiteCount > coloredCount;
        var dominantBrand = null;
        var maxBrandCount = 0;
        Object.keys(brandBucket).forEach(function (key) {
          if (brandBucket[key].count > maxBrandCount) {
            maxBrandCount = brandBucket[key].count;
            dominantBrand = brandBucket[key];
          }
        });

        var brandRgb = dominantBrand
          ? [
              Math.round(dominantBrand.r / dominantBrand.count),
              Math.round(dominantBrand.g / dominantBrand.count),
              Math.round(dominantBrand.b / dominantBrand.count)
            ]
          : partnerTopBucketColor(bgBucket) || [0, 148, 255];

        var bgRgb = partnerTopBucketColor(bgBucket) || brandRgb;
        var topRgb = partnerTopBucketColor(topBucket);
        var botRgb = partnerTopBucketColor(botBucket);
        var hasGradient = !isWhiteBg && topRgb && botRgb &&
          (Math.abs(topRgb[0] - botRgb[0]) + Math.abs(topRgb[1] - botRgb[1]) + Math.abs(topRgb[2] - botRgb[2]) > 80);

        var cardBg;
        if (overrides.cardBg) {
          cardBg = overrides.cardBg;
        } else if (isWhiteBg) {
          cardBg = partnerRgbToHex(brandRgb[0], brandRgb[1], brandRgb[2]);
        } else if (hasGradient) {
          cardBg = 'linear-gradient(180deg, ' + partnerRgbToHex(topRgb[0], topRgb[1], topRgb[2]) +
            ' 0%, ' + partnerRgbToHex(botRgb[0], botRgb[1], botRgb[2]) + ' 100%)';
        } else {
          cardBg = partnerRgbToHex(bgRgb[0], bgRgb[1], bgRgb[2]);
        }

        for (var i = 0; i < px.length; i += 4) {
          var pr = px[i];
          var pg = px[i + 1];
          var pb = px[i + 2];
          var pa = px[i + 3];
          if (pa < 20) continue;

          if (isWhiteBg) {
            if (partnerIsNearWhite(pr, pg, pb, pa)) {
              px[i + 3] = 0;
            } else {
              px[i] = 255;
              px[i + 1] = 255;
              px[i + 2] = 255;
            }
          } else if (pr > 195 && pg > 195 && pb > 195) {
            px[i] = 255;
            px[i + 1] = 255;
            px[i + 2] = 255;
          } else {
            px[i + 3] = 0;
          }
        }

        ctx.putImageData(imageData, 0, 0);
        callback({
          cardBg: cardBg,
          cardBgGlass: partnerBuildGlassBg(cardBg, {
            topRgb: topRgb,
            botRgb: botRgb,
            hasGradient: hasGradient
          }),
          logoSrc: canvas.toDataURL('image/png'),
          isWhiteBg: isWhiteBg
        });
      };
      img.onerror = function () {
        var fallback = overrides.cardBg || '#0094FF';
        callback({
          cardBg: fallback,
          cardBgGlass: partnerBuildGlassBg(fallback, {}),
          logoSrc: logoPath,
          isWhiteBg: false
        });
      };
      img.src = logoPath;
    }

    function initPartnerAccordion(container) {
      if (!container || container.dataset.accordionReady === '1') {

      partners.forEach(function (p, index) {

        var titleHtml = theme.useOriginalLogo

              '<img class="accordion-inline-logo" src="' + p.logo + '" alt="" loading="lazy" />' +
              '<span class="accordion-card-title">' + p.name + '</span>' +
            '</div>'
          : '<span class="accordion-card-title">' + p.name + '</span>';

        card.innerHTML =
          photoHtml +

          '<div class="accordion-card-collapsed">' +
            titleHtml +
            '<span class="accordion-card-industry">' + p.industry + '</span>' +
          '</div>' +
          '<img class="accordion-collapsed-logo" src="' + p.logo + '" alt="' + p.name + ' Logo" loading="lazy" />' +
          '<div class="accordion-card-expanded">' +
            '<div class="accordion-visual">' +
              '<img src="' + p.visual + '" alt="' + p.name + ' 产品架构展示" loading="lazy" />' +
            '</div>' +
            '<div class="accordion-card-detail">' +
              '<div class="accordion-detail-meta">' +
                '<h3 class="accordion-detail-title">盛意旺 × ' + p.name + '</h3>' +
                '<p class="accordion-detail-industry">' + p.industry + '</p>' +
              '</div>' +
              '<p class="accordion-detail-desc">' + p.desc + '</p>' +
            '</div>' +
          '</div>';

        if (theme.cardPhoto) {
          card.classList.add('has-card-photo');
        }

        var logoEl = card.querySelector('.accordion-collapsed-logo');
        if (theme.cardPhoto) {
          card.classList.add('theme-ready');
        } else {
          analyzePartnerLogo(p.logo, theme, function (themeResult) {
            card.style.setProperty('--card-brand-bg', themeResult.cardBg);
            card.style.setProperty('--card-brand-glass', themeResult.cardBgGlass);
            if (logoEl && themeResult.logoSrc) {
              logoEl.src = themeResult.logoSrc;
            }
            card.classList.add('theme-ready');
          });
        }

        card.addEventListener('click', function () {
          if (activeIndex === index) {
            activeIndex = null;
          } else {
            activeIndex = index;
          }
          updateState();
        });

        track.appendChild(card);
      });

      var cards = Array.from(track.querySelectorAll('.accordion-card'));

      function updateState() {
        var hasActive = activeIndex !== null;
        container.classList.toggle('has-active', hasActive);
        cards.forEach(function (card, i) {
          var expanded = activeIndex === i;
          card.classList.toggle('is-expanded', expanded);
          card.classList.toggle('is-narrow', hasActive && !expanded);
          card.setAttribute('aria-expanded', expanded ? 'true' : 'false');
          card.setAttribute('aria-selected', expanded ? 'true' : 'false');
        });
      }

      updateState();
      container.dataset.accordionReady = '1';

      return function cleanup() {
        track.innerHTML = '';
        container.classList.remove('has-active');
        delete container.dataset.accordionReady;
      };
    }

    window.initPartnerAccordion = initPartnerAccordion;
  </script>

    function highlightPhrases(text, phrases = []) {
      if (!text || !phrases.length) return text;
      const escaped = phrases
        .filter(Boolean)
        .sort((a, b) => b.length - a.length)
        .map((p) => p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      if (!escaped.length) return text;
      const re = new RegExp(`(${escaped.join('|')})`, 'g');
      const parts = text.split(re);
      return parts.map((part, i) => (
        phrases.includes(part)
          ? <strong key={i} className="font-semibold text-syw-ink">{part}</strong>
          : <React.Fragment key={i}>{part}</React.Fragment>

    function QrMark({ seed = 7, size = 132, center = 'wx' }) {
      const cells = useMemo(() => {
        const n = 21;
        const on = (x, y) => {
          const inFinder = (ox, oy) => x >= ox && x < ox + 7 && y >= oy && y < oy + 7;
          const finderCell = (ox, oy) => {
            const lx = x - ox, ly = y - oy;
            return lx === 0 || ly === 0 || lx === 6 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4);
          };
          if (inFinder(0, 0)) return finderCell(0, 0);
          if (inFinder(14, 0)) return finderCell(14, 0);
          if (inFinder(0, 14)) return finderCell(0, 14);
          if (x >= 8 && x <= 12 && y >= 8 && y <= 12) return false;
          return ((x * 17 + y * 29 + seed * 11) % 5) > 1;
        };
        const list = [];
        for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (on(x, y)) list.push(`${x}-${y}`);
        return list;
      }, [seed]);
      return (
        <div className="relative rounded-md bg-white p-1.5 ring-1 ring-syw-line" style={{ width: size, height: size }}>
          <svg viewBox="0 0 21 21" className="h-full w-full" aria-hidden="true">
            {cells.map((k) => {
              const [x, y] = k.split('-').map(Number);
              return <rect key={k} x={x} y={y} width="0.92" height="0.92" rx="0.08" fill="#0C1B2E" />;
            })}

    function AuthCard({ toast, persona }) {
      const isPartner = persona === 'partner';
      const [loginMode, setLoginMode] = useState('password');
      const [login, setLogin] = useState({ account: '', password: '', phone: '', code: '', pwdControl: false });
      const [err, setErr] = useState('');
      const [sec, setSec] = useState(0);

      useEffect(() => {
        setLoginMode('password');
        setErr('');
        setSec(0);
      }, [persona]);

      useEffect(() => {
        if (sec <= 0) return undefined;
        const t = setTimeout(() => setSec((n) => n - 1), 1000);
        return () => clearTimeout(t);
      }, [sec]);

      const phoneOk = (v) => /^1[3-9]\d{9}$/.test(v);

      const sendCode = () => {
        if (!phoneOk(login.phone)) {
          setErr('请输入有效的 11 位手机号');
          return;
        }
        setErr('');
        setSec(60);
        toast('验证码已发送（演示环境，任意 6 位即可）');
      };

      const submitLogin = (e) => {
        e.preventDefault();
        if (loginMode === 'password') {
          if (!login.account.trim() || login.password.length < 6) {
            setErr('请输入账号，且密码不少于 6 位');
            return;
          }
        } else {
          if (!phoneOk(login.phone)) {
            setErr('请输入有效的 11 位手机号');
            return;
          }
          if (!/^\d{6}$/.test(login.code)) {
            setErr('请输入 6 位短信验证码');
            return;
          }
        }
        setErr('');
        toast(isPartner ? '演示环境：即将对接服务商统一认证' : '演示环境：即将对接商户统一认证');
      };

      const portalName = isPartner ? '服务商' : '商户';

            <p className="mt-1 mb-5 text-[12px] text-syw-mute">

              <form onSubmit={submitLogin} className="flex flex-col gap-3.5" noValidate>

                    >
                      {m.label}
                    </button>
                  ))}
                </div>

                {/* 双面板叠放：高度取较高者，切换模式时登录区高度不变 */}
                <div className="grid">
                  <div
                    className={`col-start-1 row-start-1 flex flex-col gap-3.5 ${loginMode === 'password' ? '' : 'invisible pointer-events-none'}`}
                    aria-hidden={loginMode !== 'password'}
                  >
                    <label className="block">
                      <span className="mb-1.5 block text-[12px] text-syw-mute">账号</span>
                      <input
                        value={login.account}
                        onChange={(e) => setLogin({ ...login, account: e.target.value })}

                        placeholder="请输入商户账号"

                        tabIndex={loginMode === 'password' ? 0 : -1}
                      />
                    </label>
                    <label className="block">
                      <span className="mb-1.5 block text-[12px] text-syw-mute">密码</span>
                      <input
                        type="password"
                        value={login.password}
                        onChange={(e) => setLogin({ ...login, password: e.target.value })}

                        tabIndex={loginMode === 'password' ? 0 : -1}
                      />
                    </label>
                    <div className="flex h-5 items-center justify-between text-[12px]">
                      <label className="flex cursor-pointer items-center gap-2 text-syw-mute">
                        <input type="checkbox" checked={login.pwdControl} onChange={(e) => setLogin({ ...login, pwdControl: e.target.checked })} className="h-4 w-4 accent-[#0094FF]" tabIndex={loginMode === 'password' ? 0 : -1} />
                        使用密码控件登录
                      </label>
                      <a href="#help" className="text-syw hover:underline" tabIndex={loginMode === 'password' ? 0 : -1}>忘记密码</a>
                    </div>
                  </div>
                  <div
                    className={`col-start-1 row-start-1 flex flex-col gap-3.5 ${loginMode === 'sms' ? '' : 'invisible pointer-events-none'}`}
                    aria-hidden={loginMode !== 'sms'}
                  >
                    <label className="block">
                      <span className="mb-1.5 block text-[12px] text-syw-mute">手机号</span>
                      <input
                        value={login.phone}
                        onChange={(e) => setLogin({ ...login, phone: e.target.value })}
                        className="h-11 w-full rounded-xl border border-syw-line bg-white px-3.5 text-sm transition-all duration-300 ease-in-out focus:border-[#0094FF]"
                        placeholder="请输入手机号"
                        inputMode="numeric"
                        maxLength={11}
                        autoComplete="tel"
                        tabIndex={loginMode === 'sms' ? 0 : -1}
                      />
                    </label>
                    <label className="block">
                      <span className="mb-1.5 block text-[12px] text-syw-mute">短信验证码</span>
                      <div className="flex gap-2">
                        <input
                          value={login.code}
                          onChange={(e) => setLogin({ ...login, code: e.target.value })}
                          className="h-11 min-w-0 flex-1 rounded-xl border border-syw-line bg-white px-3.5 text-sm transition-all duration-300 ease-in-out focus:border-[#0094FF]"
                          placeholder="6 位验证码"
                          inputMode="numeric"
                          maxLength={6}
                          autoComplete="one-time-code"
                          tabIndex={loginMode === 'sms' ? 0 : -1}
                        />
                        <button
                          type="button"
                          onClick={sendCode}
                          disabled={sec > 0 || loginMode !== 'sms'}
                          tabIndex={loginMode === 'sms' ? 0 : -1}
                          className="h-11 shrink-0 rounded-xl bg-syw-soft px-3.5 text-[13px] font-medium text-syw transition-all duration-300 ease-in-out hover:bg-[#d6ecff] disabled:cursor-not-allowed disabled:text-syw-mute"
                        >
                          {sec > 0 ? `${sec}s 后重发` : '获取验证码'}
                        </button>
                      </div>
                    </label>
                    <div className="h-5" aria-hidden="true" />
                  </div>
                </div>

                <div className="min-h-[18px]">
                  {err ? <p className="text-[12px] leading-[18px] text-[#E11D48]">{err}</p> : null}

                <button type="submit" className="h-11 w-full rounded-xl bg-[#0094FF] text-sm font-medium text-white transition-all duration-300 ease-in-out hover:bg-syw-deep">

                  <Ico name="lock" className="h-3.5 w-3.5" />
                  资金由合作银行存管 · TLS 加密传输
                </p>
              </form>
            )}
          </div>
        </div>
      );
    }

      PARTICLE_COUNT: 36
    };

    function buildPayScatterLayout(items) {
      const cfg = PAY_SCENE_CONFIG;
      const count = items.length;
      const r = cfg.RADIUS || 210;

      return items.map((item, i) => {
        // 等角均分 360°，同一半径等距散开（像素固定，不随窗口缩放）
        const angle = -(i / count) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(angle) * r;
        const yy = Math.sin(angle) * r;
        const z = 0;

        const delay = (i / count) * cfg.STAGGER_MAX_S;
        return {
          ...item,
          tx: `${x.toFixed(1)}px`,
          ty: `${yy.toFixed(1)}px`,
          tz: `${z.toFixed(1)}px`,
          rx: '0deg',
          ry: '0deg',
          glow: item.glow || '#0094FF',
          delay: `${delay.toFixed(3)}s`,
          breatheDur: `${(3.2 + (i % 5) * 0.25).toFixed(2)}s`,
          breatheDelay: `${(delay + cfg.DURATION_S * 0.2).toFixed(2)}s`
        };
      });
    }

    function PaymentMethods() {
      const cfg = PAY_SCENE_CONFIG;
      const items = useMemo(() => {
        const source = cfg.ICON_COUNT ? PAYMENT_METHODS.slice(0, cfg.ICON_COUNT) : PAYMENT_METHODS;
        return buildPayScatterLayout(source);
      }, []);
      const stars = useMemo(() => Array.from({ length: cfg.PARTICLE_COUNT }, (_, i) => ({
        id: i,
        left: `${(i * 37 + 11) % 100}%`,
        top: `${(i * 53 + 7) % 100}%`,
        delay: `${((i * 13) % 40) / 10}s`,
        size: 1 + (i % 3)
      })), []);

      const sectionRef = useRef(null);
      const [spread, setSpread] = useState(false);
      const [breathing, setBreathing] = useState(false);
      const [titleIn, setTitleIn] = useState(false);
      const playedRef = useRef(false);

      useEffect(() => {
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const play = () => {
          if (playedRef.current) return;
          playedRef.current = true;
          if (reduce) {
            setSpread(true);
            setTitleIn(true);
            setBreathing(cfg.BREATHE);
            return;
          }
          requestAnimationFrame(() => {
            setSpread(true);
            setTitleIn(true);
            window.setTimeout(() => setBreathing(cfg.BREATHE), (cfg.DURATION_S + cfg.STAGGER_MAX_S) * 1000);
          });
        };

        if (!cfg.AUTO_PLAY) return undefined;
        const el = sectionRef.current;
        if (!el || typeof IntersectionObserver === 'undefined') {
          play();
          return undefined;
        }
        const io = new IntersectionObserver((entries) => {
          if (entries.some((e) => e.isIntersecting && e.intersectionRatio > 0.25)) {
            play();
            io.disconnect();
          }
        }, { threshold: [0.25, 0.4] });
        io.observe(el);
        return () => io.disconnect();
      }, []);

      return (
        <section id="payment-methods" ref={sectionRef}>
          <div className="pay-scatter-shell mx-auto max-w-[1200px]">
            <div className="pay-scatter-panel" aria-hidden="true" />
            <div className="pay-scatter-stars" aria-hidden="true">
              {stars.map((s) => (
                <span
                  key={s.id}
                  className="pay-scatter-star"
                  style={{ left: s.left, top: s.top, width: s.size, height: s.size, animationDelay: s.delay }}
                />
              ))}
            </div>

            <div
              className="pay-scatter-world"
              style={{
                ['--pay-duration']: `${cfg.DURATION_S}s`,
                ['--pay-ease']: cfg.EASING,
                ['--copy-delay']: `${cfg.TITLE_DELAY_S}s`
              }}
            >
              {items.map((item) => (
                <div
                  key={item.id}
                  className={`pay-scatter-node${spread ? ' is-spread' : ''}`}
                  style={{
                    ['--tx']: item.tx,
                    ['--ty']: item.ty,
                    ['--tz']: item.tz,
                    ['--rx']: item.rx,
                    ['--ry']: item.ry,
                    ['--pay-delay']: item.delay,
                    ['--glow']: item.glow,
                    ['--breathe-dur']: item.breatheDur,
                    ['--breathe-delay']: item.breatheDelay
                  }}
                >
                  <div className={`pay-scatter-breathe${breathing ? ' is-breathing' : ''}`}>
                    <div className="pay-scatter-face">
                      <div className="pay-scatter-badge">
                        <img className="pay-scatter-logo" src={item.logo} alt="" width="34" height="34" loading="lazy" />
                      </div>
                    </div>
                    <span className="pay-scatter-label">{item.label}</span>
                  </div>
                </div>
              ))}
            </div>

            <div className={`pay-scatter-copy${titleIn ? ' is-in' : ''}`}>
              <p className="pay-scatter-kicker">Payment Methods</p>
              <h2 className="pay-scatter-title">全场景支付渠道</h2>
              <p className="pay-scatter-sub">覆盖线上线下主流支付场景</p>
            </div>
          </div>
        </section>
      );
    }

                {PARTNER_HONEYCOMB_ROWS.map((row, rowIdx) => (
                  <div
                    key={rowIdx}
                    className="partner-honeycomb-row"
                    role="presentation"
                  >
                    {row.ids.map((id) => {
                      const m = merchantMap[id];
                      return (
                        <div
                          key={id}
                          className="partner-hex is-placeholder"
                          role="listitem"
                          title={m.name}
                        >
                          <div className="partner-hex-shape" aria-hidden="true" />
                          <div className="partner-hex-inner">
                            {m.logo ? (
                              <img src={m.logo} alt={m.name} className="h-[42%] w-[42%] object-contain" />
                            ) : (
                              <span className="partner-hex-mark" aria-hidden="true">{m.abbr}</span>
                            )}
                            <span className="partner-hex-name">{m.name}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Trust() {
      const items = [
        { n: '百亿级', l: '日均交易量', d: '覆盖零售、餐饮、政企采购等场景' },
        { n: '银行级', l: '资金合规', d: '备付金存管 · 支付业务许可经营' },
        { n: '7×24', l: '小时技术保障', d: '交易、结算、对账链路全天候值守' }
      ];
      return (
        <section className="trust-band py-16">
          <div className="pointer-events-none absolute inset-0 opacity-50" style={{ backgroundImage: 'radial-gradient(circle at 18% 48%, rgba(255,255,255,.18), transparent 44%), radial-gradient(circle at 82% 78%, rgba(0,118,204,.35), transparent 42%)' }} />
          <div className="relative mx-auto max-w-[1200px] px-6">
            <div className="mb-10 flex items-center gap-3">
              <span className="grid h-9 w-9 place-items-center rounded-lg bg-white/15 ring-1 ring-white/25 text-white">
                <Ico name="shield" className="h-5 w-5" />
              </span>
              <div>
                <p className="font-mono text-[11px] uppercase tracking-[0.28em] text-white/75">Trust &amp; Compliance</p>
                <h2 className="text-[22px] font-semibold text-white">金融级安全，可被审计的确定性</h2>
              </div>
            </div>
            <div className="grid grid-cols-1 divide-y divide-white/20 md:grid-cols-3 md:divide-x md:divide-y-0">
              {items.map((it) => (
                <div key={it.l} className="px-0 py-6 md:px-10 md:py-2 first:pl-0 last:pr-0">
                  <div className="num text-[40px] font-semibold leading-none tracking-tight text-white">{it.n}</div>
                  <div className="mt-3 text-[15px] text-white/90">{it.l}</div>
                  <p className="mt-2 text-[13px] text-white/65">{it.d}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function LeadBand({ toast, persona }) {
      const [form, setForm] = useState({
        company: '',
        phone: '',
        demand: persona === 'partner' ? 'agent' : 'pay'
      });
      const [err, setErr] = useState('');
      const [qrOpen, setQrOpen] = useState(false);

      useEffect(() => {
        setForm((s) => ({ ...s, demand: persona === 'partner' ? 'agent' : 'pay' }));
        setErr('');
      }, [persona]);

      const onSubmit = (e) => {
        e.preventDefault();
        if (!form.company.trim()) { setErr('请填写企业名称'); return; }
        if (!/^1[3-9]\d{9}$/.test(form.phone)) { setErr('请输入有效的 11 位手机号'); return; }
        setErr('');
        setQrOpen(true);
        setForm({ company: '', phone: '', demand: persona === 'partner' ? 'agent' : 'pay' });
      };

      const isPartner = persona === 'partner';

      return (
        <section id="lead" className="lead-band py-16">
          <LeadQrModal open={qrOpen} persona={persona} onClose={() => setQrOpen(false)} />
          <div className="pointer-events-none absolute inset-0 opacity-35" style={{ backgroundImage: 'radial-gradient(circle at 18% 22%, rgba(255,255,255,.16), transparent 44%), radial-gradient(circle at 82% 78%, rgba(0,118,204,.18), transparent 42%)' }} />
          <div className="relative z-[2] mx-auto grid max-w-[1200px] grid-cols-1 items-start gap-10 px-6 lg:grid-cols-10">
            <div className="lg:col-span-6">
              <p className="font-mono text-[11px] uppercase tracking-[0.28em] text-white/75">Get a proposal</p>
              <h2 className="mt-2 text-[28px] font-semibold text-white">资深顾问 30 分钟内提供专属报价</h2>
              <p className="mt-3 max-w-xl text-sm leading-6 text-white/80">
                {isPartner
                  ? '留下服务商接入意向，我们将匹配 API 对接、SaaS 展业与分润政策方案。'
                  : '留下商户接入意向，我们将匹配收款、硬件与费率方案。'}
              </p>
              <form onSubmit={onSubmit} className="mt-8 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4" noValidate>
                <input
                  value={form.company}
                  onChange={(e) => setForm({ ...form, company: e.target.value })}
                  placeholder="企业名称"
                  className="h-12 rounded-xl border border-white/25 bg-white/15 px-4 text-sm text-white placeholder:text-white/55 transition-all duration-300 ease-in-out focus:border-white focus:bg-white/20"
                />
                <input
                  value={form.phone}
                  onChange={(e) => setForm({ ...form, phone: e.target.value })}
                  placeholder="手机号"
                  inputMode="numeric"
                  maxLength={11}
                  className="h-12 rounded-xl border border-white/25 bg-white/15 px-4 text-sm text-white placeholder:text-white/55 transition-all duration-300 ease-in-out focus:border-white focus:bg-white/20"
                />
                <select
                  value={form.demand}
                  onChange={(e) => setForm({ ...form, demand: e.target.value })}
                  className="h-12 rounded-xl border border-white/25 bg-white/15 px-4 text-sm text-white transition-all duration-300 ease-in-out focus:border-white focus:bg-white/20"
                >
                  {DEMANDS.map((d) => <option key={d.value} value={d.value} className="text-syw-ink">{d.label}</option>)}
                </select>
                <button type="submit" className="h-12 rounded-xl bg-white text-sm font-medium text-[#0094FF] transition-all duration-300 ease-in-out hover:bg-white/90">
                  提交需求
                </button>
              </form>
              {err && <p className="mt-3 text-[12px] text-[#FFE4E6]">{err}</p>}
            </div>
            <div className="lg:col-span-4">
              <LeadSteps persona={persona} />
            </div>
          </div>
        </section>
      );
    }

    function Footer() {
      const qrItems = [
        { title: '盛意旺公众号', src: 'qr/wechat-oa.png', alt: '盛意旺公众号二维码' },
        { title: '盛意旺 APP', src: 'qr/app-download.png', alt: '盛意旺 APP 下载二维码' },
        { title: '企微客服', src: 'qr/wecom-cs.png', alt: '企微客服二维码' }
      ];
      return (
        <footer id="help" className="site-footer py-10">
          <div className="mx-auto flex max-w-[1200px] flex-col gap-8 px-6 md:flex-row md:items-end md:justify-between">
            <div>
              <Logo compact />
              <p className="mt-4 max-w-md text-[12px] leading-6 text-syw-mute">
                © 2026 盛付通电子支付服务有限公司 保留所有权利<br />
                客服支持：400-720-8888 人工服务：9:00-22:00 自助服务：7x24小时<br />
                沪公网备31011502001963号 沪ICP备08024653号-10
              </p>
              <div className="mt-3 flex gap-4 text-[12px] text-syw-mute">
                <a href="#help" className="hover:text-syw">隐私政策</a>
                <a href="#help" className="hover:text-syw">服务协议</a>
                <a href="#open-platform" className="hover:text-syw">开放平台</a>
              </div>
            </div>
            <div className="flex flex-wrap justify-center gap-6 overflow-visible pt-2 sm:justify-end">
              {qrItems.map((q) => (
                <QrImg key={q.title} src={q.src} alt={q.alt} size={88} label={q.title} hoverZoom />
              ))}
            </div>
          </div>
        </footer>
      );
    }

    function FloatBar() {
      const [showTop, setShowTop] = useState(false);
      const [hover, setHover] = useState(null);
      useEffect(() => {
        const onScroll = () => setShowTop(window.scrollY > 420);
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      const items = [
        { id: 'cs', label: '企微客服', icon: 'chat', src: 'qr/wecom-cs.png', copy: '扫码添加企微客服' },
        { id: 'wx', label: '官方微信', icon: 'wechat', src: 'qr/wechat-oa.png', copy: '扫码关注官方公众号' }
      ];
      return (
        <div className="fixed bottom-6 right-5 z-50 flex flex-col items-end gap-2">
          {items.map((it) => (
            <div
              key={it.id}
              className="relative"
              onMouseEnter={() => setHover(it.id)}
              onMouseLeave={() => setHover(null)}
            >
              <div className={`absolute right-[58px] top-1/2 w-[176px] -translate-y-1/2 rounded-2xl bg-white p-3 shadow-lift ring-1 ring-syw-line transition-all duration-300 ease-in-out ${hover === it.id ? 'opacity-100 translate-x-0' : 'pointer-events-none translate-x-2 opacity-0'}`}>
                <div className="overflow-hidden rounded-md bg-white">
                  <img src={it.src} alt={it.label} width="152" height="152" className="h-[152px] w-[152px] object-contain" />
                </div>
                <p className="mt-2 text-center text-[11px] text-syw-mute">{it.copy}</p>
              </div>
              <button
                aria-label={it.label}
                aria-expanded={hover === it.id}
                onClick={() => setHover(it.id)}
                className="grid h-12 w-12 place-items-center rounded-2xl bg-white text-syw-ink shadow-sm ring-1 ring-syw-line transition-all duration-300 ease-in-out hover:text-syw"
              >
                <Ico name={it.icon} />
              </button>
            </div>
          ))}
          <button
            aria-label="返回顶部"
            onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
            className={`grid h-12 w-12 place-items-center rounded-2xl bg-syw-ink text-white shadow-sm transition-all duration-300 ease-in-out ${showTop ? 'opacity-100' : 'pointer-events-none opacity-0'}`}
          >
            <Ico name="top" />
          </button>
        </div>
      );
    }

    function HeroPayBand({ persona, toast, onLead }) {
      const isPartner = persona === 'partner';
      const kvSrc = isPartner ? 'kv-partner.png' : 'kv-merchant-extend.png';
      return (
        <div className={`hero-pay-band${isPartner ? ' is-partner' : ''}`}>
          <div
            key={kvSrc}
            className="hero-pay-band-bg pointer-events-none"
            style={{ backgroundImage: `url('${kvSrc}')` }}
            aria-hidden="true"
          />
          <div className="hero-pay-band-overlay pointer-events-none" aria-hidden="true" />
          <Hero persona={persona} toast={toast} onLead={onLead} />
          <PaymentMethods />
        </div>
      );
    }

    function App() {
      const [persona, setPersona] = useState('merchant');
      const [menuOpen, setMenuOpen] = useState(false);
      const [toast, setToast] = useState('');
      const goLead = () => {
        setMenuOpen(false);
        document.getElementById('lead')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      return (
        <div id="top" className="min-h-screen bg-syw-mist">
          <a href="#products" className="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[90] focus:rounded-md focus:bg-white focus:px-3 focus:py-2">跳到产品矩阵</a>
          <Header onLead={goLead} menuOpen={menuOpen} onOpenMenu={() => setMenuOpen((v) => !v)} persona={persona} setPersona={setPersona} />
          <main>
            <HeroPayBand persona={persona} toast={setToast} onLead={goLead} />
            <Products persona={persona} onLead={goLead} />
            <IndustrySolutions onLead={goLead} />
            <Cases />
            <PartnerMerchants />
            <Trust />
            <LeadBand toast={setToast} persona={persona} />
          </main>
          <Footer />
          <FloatBar />
          {toast && <Toast msg={toast} onDone={() => setToast('')} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
