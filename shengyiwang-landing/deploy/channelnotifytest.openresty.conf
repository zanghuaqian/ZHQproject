# 加到 channelnotifytest.shengpay.com 现有 443 server 里。
# 本机或同机运行: python lead_server.py --port 8088
#
# 推荐：把 lead_server 部署在这台 OpenResty 机器上，反代到 127.0.0.1:8088
# 备选：若服务跑在开发机，把下面 upstream 改成开发机内网 IP。

upstream syw_lead {
    server 127.0.0.1:8088;
    keepalive 8;
}

# 企微验签 + 事件回调
location /wx/callback {
    proxy_pass http://syw_lead;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 8s;
    proxy_connect_timeout 3s;
}

# 留资接口与健康检查（联调 / 前端同源时可开）
location /api/ {
    proxy_pass http://syw_lead;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
